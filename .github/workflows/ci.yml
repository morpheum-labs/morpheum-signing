# Continuous integration for morpheum-signing.
#
# ## Why these sibling checkouts
#
# morpheum-signing reaches its dependencies through `../` path entries, so cargo
# needs them on disk as siblings. The list below is the *transitive*
# closure, not just this repo's direct entries: cargo must resolve the
# whole graph, so a dependency-of-a-dependency is just as required. An
# earlier revision listed only the direct ones and failed on a missing
# `morpheum-proto` that arrives via `morpheum-primitives`.
#
# This applies to `cargo fmt` as much as to the rest — `--all` resolves
# the package graph, so it fails without the siblings too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morpheum-signing
    steps:
      - uses: actions/checkout@v4
        with:
          path: morpheum-signing
      - name: Verify access to private siblings
        # Fail here, naming the repository, rather than midway through a
        # checkout whose 404 does not distinguish "no such repository"
        # from "token cannot see it".
        env:
          CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}
        run: |
          if [ -z "$CI_REPO_READ_TOKEN" ]; then
            echo "::error::CI_REPO_READ_TOKEN is unset. morpheum-signing depends on private repositories (cryptogram morpheum-primitives morpheum-proto) through ../ paths. Secrets are not provided to workflows triggered from forks, so this is expected on fork pull requests."
            exit 1
          fi
          failed=""
          for repo in cryptogram morpheum-primitives morpheum-proto; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $CI_REPO_READ_TOKEN" \
                     "https://api.github.com/repos/morpheum-labs/$repo")
            echo "  $repo: HTTP $code"
            [ "$code" = "200" ] || failed="$failed $repo"
          done
          if [ -n "$failed" ]; then
            echo "::error::CI_REPO_READ_TOKEN cannot read:$failed. Grant read-only Contents access to each, and authorise SSO if the organisation requires it."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/cryptogram
          path: cryptogram
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/morpheum-primitives
          path: morpheum-primitives
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morpheum-labs/morpheum-proto
          path: morpheum-proto
          token: ${{ secrets.CI_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install protoc
        # `morpheum-proto` generates its bindings with prost-build, which
        # shells out to protoc. The runner image does not ship it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: morpheum-signing -> target
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo check (wasm32 — the target crates/wasm actually ships to)
        # Every step above builds for the host, and `crates/wasm/src/lib.rs`
        # carries `#![cfg(target_arch = "wasm32")]`. On the host it is an EMPTY
        # crate: a green workspace run says nothing whatsoever about the code
        # `wasm-pack` publishes, and an arity break in `build_sign_doc_bytes`
        # has already reached `main` through exactly that blind spot.
        #
        # Default features on purpose — that is what `wasm-pack build` uses, so
        # this gates the shipped configuration. `--all-features` would add
        # `cryptogram`, whose transitive `mio` does not build for wasm32 at all,
        # gating a configuration nobody can ship.
        run: cargo check --target wasm32-unknown-unknown -p morpheum-signing-wasm
